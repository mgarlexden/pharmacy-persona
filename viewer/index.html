<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>약국 데이터 점검판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 상단 요약 + 탭 5개. 표를 누르면 근거·연결이 아래로 펼쳐지는 점검 도구 */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --ink:#1c2827; --muted:#586664; --faint:#8a9694; --line:#d9e1df; --soft:#eaf0ee;
  --accent:#1d6b65; --accent-soft:#dcefec; --accent-ink:#0f4743;
  --ok:#2c7a4b; --ok-bg:#e0f1e6; --warn:#9a5b0a; --warn-bg:#fbefd6; --bad:#b0352a; --bad-bg:#fae0dc;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121b1a; --panel:#1a2524; --ink:#e4ecea; --muted:#a2b0ad; --faint:#74827f; --line:#2c3b39; --soft:#223130;
  --accent:#58b9b0; --accent-soft:#1b3b38; --accent-ink:#a9e3dd;
  --ok:#6cc58d; --ok-bg:#1c3326; --warn:#e0a24c; --warn-bg:#392c14; --bad:#ee7f73; --bad-bg:#3d1f1b; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121b1a; --panel:#1a2524; --ink:#e4ecea; --muted:#a2b0ad; --faint:#74827f; --line:#2c3b39; --soft:#223130;
  --accent:#58b9b0; --accent-soft:#1b3b38; --accent-ink:#a9e3dd;
  --ok:#6cc58d; --ok-bg:#1c3326; --warn:#e0a24c; --warn-bg:#392c14; --bad:#ee7f73; --bad-bg:#3d1f1b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55;margin:0}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:24px 56px}
h1{font-size:22px;margin:0 0 4px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0 0 18px;max-width:70ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
.tabs button{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:8px;padding:6px 14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.tabs button .n{font-family:var(--mono);font-size:11.5px;margin-left:6px;opacity:.8}
button:focus-visible,select:focus-visible,input:focus-visible,tr.r:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{display:flex;flex-direction:column;gap:22px;padding-top:18px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .v small{font-size:13px;color:var(--faint)}
.bar{height:6px;background:var(--soft);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
h2{font-size:15px;margin:0 0 8px;font-weight:600}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.checks{display:grid;gap:6px}
.check{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:6px 0;border-bottom:1px solid var(--soft)}
.check:last-child{border-bottom:0}
.check .t{font-weight:500} .check .m{color:var(--bad);font-size:12.5px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:5px;padding:1px 8px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)} .chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.mono,.mono{font-family:var(--mono)}
.todo{margin:0;padding-left:18px;display:grid;gap:4px}
.todo li{color:var(--ink)} .todo b{font-family:var(--mono);font-weight:500}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.filters label{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
select,input[type=search]{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-width:0;max-width:100%}
input[type=search]{width:220px}
.count{margin-left:auto;color:var(--muted);font-size:12.5px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:13px}
th{position:sticky;top:0;text-align:left;font-size:12px;color:var(--muted);font-weight:600;background:var(--panel);border-bottom:1.5px solid var(--line);padding:8px 10px;white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--soft);vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tr.r{cursor:pointer} tr.r:hover td{background:var(--soft)}
tr.r td:first-child{font-family:var(--mono);white-space:nowrap}
tr.d td{background:var(--bg);padding:12px 14px}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.det h3{font-size:12px;color:var(--muted);margin:0 0 4px;font-weight:600}
.det p{margin:0 0 6px}
.det ul{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.det li{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:6px 9px;min-width:0;overflow-wrap:anywhere}
.det li .id{font-family:var(--mono);font-size:12px;color:var(--accent-ink);margin-right:6px}
.det li .q{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.none{color:var(--faint)}
.tabsub{display:flex;gap:6px;flex-wrap:wrap}
.tabsub button{font:inherit;font-family:var(--mono);font-size:12.5px;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:7px;padding:4px 10px;cursor:pointer}
.tabsub button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.note{color:var(--muted);font-size:12.5px;max-width:80ch}
.gen{color:var(--faint);font-size:12px;margin-top:18px}
@media (max-width:560px){.wrap{padding-inline:16px} input[type=search]{width:100%} .count{margin-left:0}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

/* 표 + 펼침 행 */
function table(cols, items, rowFn, detailFn, id) {
  const head = cols.map(c => `<th class="${c[1]||''}">${c[0]}</th>`).join('');
  const body = items.map((it, i) => `<tr class="r" tabindex="0" data-i="${i}" aria-expanded="false">${rowFn(it)}</tr><tr class="d" hidden><td colspan="${cols.length}">${detailFn(it)}</td></tr>`).join('');
  return `<div class="scroll"><table id="${id}"><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${cols.length}" class="none">조건에 맞는 항목이 없습니다.</td></tr>`}</tbody></table></div>`;
}
document.addEventListener('click', e => toggle(e.target.closest('tr.r')));

function toggle(tr) { if (!tr) return; const d = tr.nextElementSibling; d.hidden = !d.hidden; tr.setAttribute('aria-expanded', String(!d.hidden)); }

function renderSearch() {
  const el = $('#p-search');
  const claimUse = {};
  D.variables.forEach(v => v.claims.forEach(c => (claimUse[c] ||= {v: [], r: []}).v.push(v.id)));
  D.rules.forEach(r => r.claims.forEach(c => (claimUse[c] ||= {v: [], r: []}).r.push(r.id)));
  el.innerHTML = `<div class="filters"><label style="flex:1;min-width:240px">전체 검색 <input type="search" id="sq" style="width:100%" placeholder="ID, 이름, 인터뷰 발언 속 단어 · 예: X005, 재고, 감기, DT_L11, 호흡기"></label></div>
    <p class="note">변수, 인터뷰 발언 원문, 데이터, 가상값, 규칙을 한꺼번에 찾습니다. 찾는 항목이 한 곳도 안 나오면 아직 정의되지 않은 것입니다. 변수를 누르면 근거와 연결이 펼쳐집니다.</p><div id="sr"></div>`;
  const draw = () => {
    const q = $('#sq').value.trim().toLowerCase(), out = $('#sr');
    if (!q) { out.innerHTML = `<p class="none">검색어를 입력하세요.</p>`; return; }
    const hit = (...xs) => xs.join(' ').toLowerCase().includes(q);
    const cap = (arr, n = 12) => [arr.slice(0, n), arr.length - n];
    const groups = [
      ['변수', D.variables.filter(v => hit(v.id, v.label, v.finding, v.implName)), v => ({id: v.id, title: v.label, sub: `${v.catKo} · 근거 ${v.claims.length} · 데이터 ${v.data.length} · 가상값 ${v.params.length}`, detail: varDetail(v), chip: STAT[v.status]})],
      ['인터뷰 발언', Object.entries(D.claims).filter(([id, c]) => hit(id, c.topic, c.quote)), ([id, c]) => { const u = claimUse[id] || {v: [], r: []}; return {id, title: c.topic, sub: `“${c.quote}” · ${c.loc}`, detail: `<div class="det"><div><h3>이 발언을 근거로 쓰는 변수</h3><p>${u.v.map(x => chip('mono', x)).join(' ') || '<span class="none">없음</span>'}</p></div><div><h3>이 발언을 근거로 쓰는 규칙</h3><p>${u.r.map(x => chip('mono', x)).join(' ') || '<span class="none">없음</span>'}</p></div></div>`}; }],
      ['데이터', D.data.filter(d => hit(d.id, d.item, d.provider, d.dataset, d.area)), d => ({id: d.id, title: d.item, sub: `${d.provider} · ${d.spatial} · ${d.time} · 변수 ${d.usedBy.length}개`, chip: JL[d.judgement], detail: `<div class="det"><div><h3>이 데이터를 쓰는 변수</h3><p>${d.usedBy.map(x => chip('mono', x)).join(' ') || '<span class="none">없음</span>'}</p></div><div><h3>연결 키</h3><p>${d.keys.map(k => chip('mono', k)).join(' ') || '<span class="none">없음</span>'}</p></div></div>`})],
      ['가상값', D.params.filter(p => hit(p.id, p.label, p.basis, p.reason)), p => ({id: p.id, title: `${p.label} = ${p.value} ${p.unit}`, sub: `${ORIGIN[p.origin]} · 등급 ${p.grade || '–'} · 대표 변수 ${p.variable || '없음'}`, chip: p.grade ? [GR[p.grade], p.grade] : null, detail: `<div class="det"><div><h3>등급 이유</h3><p>${esc(p.reason)}</p><h3>출처·계산</h3><p>${esc(p.basis)}</p></div><div><h3>약사에게 물을 질문</h3><p>${p.validation ? esc(p.validation.question) : '대상 아님'}</p></div></div>`})],
      ['규칙', D.rules.filter(r => hit(r.id, r.title)).concat(D.guardrails.filter(g => hit(g.id, g.rule))), r => ({id: r.id, title: r.title || r.rule, sub: `근거 발언 ${r.claims.length}건 · ${(r.vars || []).length ? '변수 ' + r.vars.join(', ') : ''}`, detail: `<div class="det"><div><h3>근거 발언</h3>${list(r.claims.map(claimHtml), '없음')}</div></div>`})],
    ];
    const total = groups.reduce((n, g) => n + g[1].length, 0);
    out.innerHTML = `<p class="note"><b>${total}건</b> 찾았습니다.</p>` + (total ? groups.filter(g => g[1].length).map(([name, arr, fn]) => {
      const [shown, more] = cap(arr);
      return `<div class="box"><h2>${name} ${arr.length}건</h2><div class="scroll"><table><tbody>${shown.map(fn).map(r => `<tr class="r" tabindex="0" aria-expanded="false"><td>${esc(r.id)}</td><td>${esc(r.title)}<div class="none">${esc(r.sub)}</div></td><td>${r.chip ? chip(...r.chip) : ''}</td></tr><tr class="d" hidden><td colspan="3">${r.detail}</td></tr>`).join('')}</tbody></table></div>${more > 0 ? `<p class="note">외 ${more}건. 검색어를 더 구체적으로 입력하세요.</p>` : ''}</div>`;
    }).join('') : `<div class="box"><b>일치하는 항목이 없습니다.</b><p class="note">이 단어를 가진 변수, 발언, 데이터, 가상값, 규칙이 정의되어 있지 않다는 뜻입니다. 다른 표현으로도 검색해 보세요.</p></div>`);
  };
  $('#sq').addEventListener('input', draw); draw();
}

/* ---------- 탭 ---------- */
const TABS = [['summary','요약',null],['files','파일',D.files.length],['search','검색',null],['variables','변수',D.variables.length],['data','데이터',D.data.length],['params','가상값',D.params.length],['tables','시계열',D.tables.length],['rules','규칙·프로필',null]];
function show(id) {
  TABS.forEach(t => { $('#p-' + t[0]).hidden = t[0] !== id; });
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.id === id)));
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
}
$('#tabs').innerHTML = TABS.map(t => `<button role="tab" data-id="${t[0]}">${t[1]}${t[2] != null ? `<span class="n">${t[2]}</span>` : ''}</button>`).join('');
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) show(b.dataset.id); });
renderSummary(); renderFiles(); renderSearch(); renderVariables(); renderData(); renderParams(); renderTables(); renderRules();
const h = location.hash.slice(1); show(TABS.some(t => t[0] === h) ? h : 'summary');
$('#gen').textContent = `CSV 기준 시각 ${D.generatedAt} · ${D.counts}`;
</script>
